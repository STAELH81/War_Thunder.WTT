<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patch Note Generator V2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🛠️ Patch Note Generator V2</h1>
      <p>Outil d'analyse de Tech Tree</p>
    </header>

    <main>
      <section class="controls">
        <div class="file-inputs">
          <label>📁 Ancienne version (Tous les pays) : <input type="file" id="old-json" accept=".json" multiple></label>
          <label>📁 Nouvelle version (Tous les pays) : <input type="file" id="new-json" accept=".json" multiple></label>
        </div>
        <button id="generate-btn">Générer le Patch Note Global</button>
      </section>

      <section class="result-section">
        <div class="result-header">
          <h2>Résultat :</h2>
          <button id="copy-btn">📋 Copier</button>
        </div>
        <pre id="output">En attente des fichiers...</pre>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
